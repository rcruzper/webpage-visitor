services:
  webpage-visitor:
    build: .
    image: webpage-visitor:latest
    container_name: webpage_visitor
    restart: unless-stopped
    # We run as the internal 'node' user (UID 1000).

    environment:
      # --- Cron Configuration ---
      # Format: Minute Hour DayOfMonth Month DayOfWeek
      # Example: "0 8 * * *" = Every day at 08:00 AM
      # If you comment this line, it will run once and exit.
      - CRON_SCHEDULE=0 8 * * *

      # --- Bot Configuration ---
      - TARGET_URL=
      - USER_LOGIN=
      - USER_PASSWORD=

      # --- Selectors (Adjust if the website changes) ---
      - USERNAME_SELECTOR=
      - PASSWORD_SELECTOR=
      - LOGIN_BUTTON_SELECTOR=
      # Optional: Link to click after login (e.g., 'a#my-link')
      - POST_LOGIN_LINK_SELECTOR=

      # --- System Options ---
      - HEADLESS=true
      - NODE_ENV=production
      # Timezone to ensure the Cron runs at the correct local time
      - TZ=GMT

      # --- Notifications (Ntfy) ---
      # Server URL (e.g. https://ntfy.sh or http://ntfy-server:80)
      - NTFY_SERVER=https://ntfy.sh
      # The topic to publish to
      - NTFY_TOPIC=
      # Optional: Credentials if your topic is protected
      - NTFY_USER=
      - NTFY_PASSWORD=
